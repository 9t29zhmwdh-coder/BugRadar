name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    permissions:
      # Nur was ueber das workflow-weite contents: read hinausgeht.
      # Read-Rechte hier zu wiederholen ist das, was OpenSSF Scorecard
      # als zu weite Token-Berechtigung bemaengelt.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BugRadar ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable-named DMG (for README download link)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find target/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$dmg" BugRadar.dmg
          gh release upload "${{ github.ref_name }}" BugRadar.dmg --clobber --repo ${{ github.repository }}

      - name: Upload stable-named installer (for README download link)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "BugRadar-Setup.exe"
          gh release upload "${{ github.ref_name }}" "BugRadar-Setup.exe" --clobber --repo ${{ github.repository }}

      - name: Upload stable-named AppImage (for README download link)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(find target/release/bundle/appimage -name "*.AppImage" | head -1)
          cp "$appimage" BugRadar.AppImage
          gh release upload "${{ github.ref_name }}" BugRadar.AppImage --clobber --repo ${{ github.repository }}
