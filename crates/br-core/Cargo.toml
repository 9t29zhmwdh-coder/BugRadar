[package]
name    = "br-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
reqwest     = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }

notify                = "6"
notify-debouncer-full = "0.3"
bollard               = "0.18"
sysinfo               = "0.33"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "macros"] }
serde_yaml  = "0.9"
toml        = "0.8"
regex       = "1"
dashmap     = "6"
keyring       = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-openssl", "tokio"] }
async-trait   = "0.1"
futures-util  = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
