[workspace]
members = [
    "crates/br-core",
    "crates/br-cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.0.8"
edition = "2021"
authors = ["Rafael Yilmaz"]
license = "MIT"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.13", features = ["json", "rustls"], default-features = false }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx        = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "macros"] }
keyring     = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-openssl", "tokio"] }
